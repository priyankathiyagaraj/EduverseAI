{% extends 'base.html' %}

{% block title %}Sign In | EduVerse AI{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-md space-y-6">
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl mx-auto shadow-2xs mb-3">
                E
            </div>
            <h2 class="text-2xl font-extrabold text-[#1E3A8A] tracking-tight">Sign in to EduVerse AI</h2>
            <p class="text-xs text-slate-500 mt-1">Access personalized recommendations, saved colleges, and comparisons</p>
        </div>

        <form action="{{ url_for('auth.login_page', next=next) }}" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 mb-1.5">Email Address</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email" placeholder="you@example.com" class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 bg-white transition placeholder-slate-400">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 bg-white transition placeholder-slate-400">
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-2xs transition cursor-pointer">
                Sign In
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
            Don't have an account yet? 
            <a href="{{ url_for('auth.register_page') }}" class="font-semibold text-blue-600 hover:text-blue-800">
                Create one now
            </a>
        </div>
    </div>
</div>
{% endblock %}
