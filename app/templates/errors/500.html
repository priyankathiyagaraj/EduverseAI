{% extends 'base.html' %}

{% block title %}500 - Server Error | EduVerse AI{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-16 px-4">
    <div class="text-center max-w-md">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-rose-50 text-rose-600 mb-6 font-bold text-2xl">
            500
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Internal Server Error</h1>
        <p class="text-sm text-slate-600 mt-3 leading-relaxed">
            An unexpected error occurred while processing your request. Please try again or return to the homepage.
        </p>
        <div class="mt-8 flex justify-center">
            <a href="{{ url_for('main.index') }}" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition">
                Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
