{% extends 'base.html' %}

{% block title %}404 - Page Not Found | EduVerse AI{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-16 px-4">
    <div class="text-center max-w-md">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mb-6 font-bold text-2xl">
            404
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Page Not Found</h1>
        <p class="text-sm text-slate-600 mt-3 leading-relaxed">
            The college record, route, or resource you are looking for does not exist or may have been relocated.
        </p>
        <div class="mt-8 flex justify-center space-x-3">
            <a href="{{ url_for('main.index') }}" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition">
                Return Home
            </a>
            <a href="{{ url_for('colleges.explore') }}" class="px-5 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition">
                Explore Colleges
            </a>
        </div>
    </div>
</div>
{% endblock %}
