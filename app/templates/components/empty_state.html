<div class="p-12 text-center bg-white rounded-2xl border border-slate-200 shadow-sm max-w-lg mx-auto">
    <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-slate-400">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
    </div>
    <h3 class="text-base font-bold text-slate-800">{{ title or "No Colleges Found" }}</h3>
    <p class="text-xs text-slate-500 mt-2 leading-relaxed">
        {{ message or "We could not find any institutions matching your selected filter criteria. Try relaxing your budget ceiling or selecting another district." }}
    </p>
    {% if show_reset %}
        <div class="mt-6">
            <button type="button" onclick="resetFilters()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">
                Reset All Filters
            </button>
        </div>
    {% endif %}
</div>
