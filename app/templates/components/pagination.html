{% if pagination and pagination.pages > 1 %}
<nav class="flex items-center justify-between border-t border-slate-200 px-4 py-3 sm:px-6 mt-6" aria-label="Pagination">
    <div class="hidden sm:block">
        <p class="text-xs text-slate-500">
            Showing page <span class="font-bold text-slate-900">{{ pagination.page }}</span> of <span class="font-bold text-slate-900">{{ pagination.pages }}</span>
        </p>
    </div>
    <div class="flex flex-1 justify-between sm:justify-end space-x-2">
        {% if pagination.has_prev %}
            <a href="{{ url_for(request.endpoint, page=pagination.prev_num, **request.args) }}" class="relative inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
                &larr; Previous
            </a>
        {% endif %}
        {% if pagination.has_next %}
            <a href="{{ url_for(request.endpoint, page=pagination.next_num, **request.args) }}" class="relative inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
                Next &rarr;
            </a>
        {% endif %}
    </div>
</nav>
{% endif %}
